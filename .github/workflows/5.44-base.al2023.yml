name: Build base-5.44.al2023 image

on:
  push:
    branches:
      - main
    tags:
      - "5.44-base.al2023/*"
  pull_request:
    paths:
      - ".github/workflows/5.44-base.al2023.yml"
      - "dockerfiles/5.44/base.al2023/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: "5.44"
      - name: build
        run: ./scripts/build.pl 5.44 base.al2023

      - name: Publish to DockerHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin
          ./scripts/publish.pl "$USERNAME/p5-aws-lambda" 5.44 base.al2023 base-5.44.al2023
          docker logout

      - name: Publish to GitHub Packages Container registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin ghcr.io
          ./scripts/publish.pl "ghcr.io/$USERNAME/p5-aws-lambda" 5.44 base.al2023 base-5.44.al2023
          docker logout ghcr.io
