name: update

on:
  schedule:
    - cron: "4 7 * * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: install docker-tags
        run: |
          cd /tmp
          curl -sSL https://github.com/koki-develop/docker-tags/releases/download/v0.9.0/docker-tags_Linux_x86_64.tar.gz | tar xz
          sudo mv docker-tags /usr/local/bin/

      - uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: "5.44"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::445285296882:role/lambda-perl5-runtime-ecr-DeploymentRole-199JZ5SP862Q0

      - name: Update Dockerfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/update.sh

      # commit and push
      - id: generate
        uses: shogo82148/actions-github-app-token@v1.3.3
      - name: Commit and push
        uses: shogo82148/actions-commit-and-create-pr@v1.1.4
        with:
          github-token: ${{ steps.generate.outputs.token }}
