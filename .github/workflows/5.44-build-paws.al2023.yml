name: Build build-5.44-paws.al2023 image

on:
  push:
    branches:
      - main
    tags:
      - "5.44-build-paws.al2023/*"
  pull_request:
    paths:
      - ".github/workflows/5.44-build-paws.al2023.yml"
      - "dockerfiles/5.44/build-paws.al2023/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1.44.0
        with:
          perl-version: "5.44"
      - name: build
        run: ./scripts/build.pl 5.44 build-paws.al2023

      - name: Publish to DockerHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin
          ./scripts/publish.pl "$USERNAME/p5-aws-lambda" 5.44 build-paws.al2023 build-5.44-paws.al2023
          docker logout

      - name: Publish to GitHub Packages Container registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin ghcr.io
          ./scripts/publish.pl "ghcr.io/$USERNAME/p5-aws-lambda" 5.44 build-paws.al2023 build-5.44-paws.al2023
          docker logout ghcr.io
