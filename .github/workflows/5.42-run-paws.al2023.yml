name: Build 5.42-paws.al2023 image

on:
  push:
    branches:
      - main
    tags:
      - "5.42-run-paws.al2023/*"
  pull_request:
    paths:
      - ".github/workflows/5.42-run-paws.al2023.yml"
      - "dockerfiles/5.42/run-paws.al2023/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/checkout@v7.0.1
      - uses: shogo82148/actions-setup-perl@v1.44.4
        with:
          perl-version: "5.44"
      - name: build
        run: ./scripts/build.pl 5.42 run-paws.al2023

      - name: Publish to DockerHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin
          ./scripts/publish.pl "$USERNAME/p5-aws-lambda" 5.42 run-paws.al2023 5.42-paws.al2023
          docker logout

      - name: Publish to GitHub Packages Container registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printenv PASSWORD | docker login --username "$USERNAME" --password-stdin ghcr.io
          ./scripts/publish.pl "ghcr.io/$USERNAME/p5-aws-lambda" 5.42 run-paws.al2023 5.42-paws.al2023
          docker logout ghcr.io
